[pytest]

# === Descoberta e execução ===
testpaths = tests
python_files = test_*.py

# Substitui o sys.path.insert do conftest. Requer pytest >= 7.0.
pythonpath = .

addopts =
    --tb=short
    --strict-markers
    --strict-config

# xfail passa a falhar quando o teste inesperadamente passa,
# evitando que marcações temporárias virem dívida silenciosa.
xfail_strict = true

# === Markers ===
markers =
    smoke: testes críticos do fluxo principal
    regression: cenários negativos, alternativos e de borda
    e2e: jornada completa de ponta a ponta
    api: testes da API de controle de celular
    unit: lógica pura, sem Appium, emulador ou API (make unit)
    exibir_lembrete: o teste valida o popup de lembrete (no Android ele sempre aparece; marker mantido por paridade com o iOS)
    primeiro_acesso: a sessão compartilhada sobe com instalação limpa (padrão: sessão morna)
    consome_massa: altera dados irreversivelmente; só roda com --consumir-massa
    ct(id): ID do caso de teste (ex.: CT011); único por teste, aparece no report

# === Logs ===
# Desligado por padrão: com xdist a saída de múltiplos workers
# fica intercalada. Habilite sob demanda com -o log_cli=true.
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(message)s
log_cli_date_format = %H:%M:%S