# Exemplo do config/env.emulator.yaml: make <comando> (padrão: o emulador).
# Usuário de teste do EMULADOR (diferente do usuário do celular, para
# os dois rodarem ao mesmo tempo sem disputar login, celular e massa).
# Relatórios em reports/emulator/.

# === Execução ===
ENV: "local"

# === Aplicação ===
APP_SYSTEM: "SEU_SISTEMA"
APP_USER: "SEU_USUARIO"
APP_PASSWORD: "SUA_SENHA"
# Senha temporária do teste de troca da senha do sistema (quando o teste
# for trazido do iOS). Vazio: o teste de troca é pulado.
APP_PASSWORD_NOVA: ""
# PIN do primeiro acesso: um dígito repetido (ex.: "1111"); a digitação
# robusta toca o mesmo dígito até a tela mudar.
APP_PIN: "1111"
# PIN temporário do teste de Alterar PIN (quando o teste for trazido do
# iOS). Mesmo formato do APP_PIN e diferente dele. Vazio: o teste é pulado.
APP_PIN_NOVO: ""

# apk = Appium instala o APK informado em APP_PATH (padrão:
# app/ifPontoCell.apk).
# package = usa o app já instalado no device (ANDROID_APP_PACKAGE).
APP_SOURCE: "apk"
APP_PATH: "app/ifPontoCell.apk"

# === Android ===
ANDROID_TARGET: "emulator"
ANDROID_APP_PACKAGE: "br.com.ifractal.Stou"
ANDROID_APP_ACTIVITY: "br.com.ifractal.stou.view.MainActivity"
ANDROID_APP_WAIT_ACTIVITY: "*"
ANDROID_AUTO_GRANT_PERMISSIONS: "true"
ANDROID_NEW_COMMAND_TIMEOUT: "120"
ANDROID_NO_RESET: "false"
ANDROID_FULL_RESET: "false"
# Zera as animações do sistema durante a sessão: menos falha
# intermitente por toque durante transição. Padrão: "true".
ANDROID_DISABLE_WINDOW_ANIMATION: "true"
ANDROID_IGNORE_HIDDEN_API_POLICY_ERROR: "true"
ANDROID_WAIT_FOR_IDLE_TIMEOUT: "500"

# === Android Emulador ===
# ANDROID_UDID: opcional com um emulador só (adb devices, ex.:
# "emulator-5554").
ANDROID_UDID: ""
ANDROID_DEVICE_NAME: ""
ANDROID_PLATFORM_VERSION: ""
# Porta do servidor UiAutomator2 no Mac. Vazio: a padrão (8200). Com
# emulador e celular ao mesmo tempo, cada um com a sua (ex.: 8200 e 8201).
ANDROID_SYSTEM_PORT: "8200"

# === Localização simulada ===
# Emulador e celular. No celular, sem ela vale o GPS de verdade: fora da
# geo do usuário, o registro de ponto avisa e falha.
# Localização padrão da sessão. Com geo delimitação cadastrada para o
# usuário, use um ponto DENTRO da área: o registro de ponto comum
# (make registro-ponto) também marca com ela.
ANDROID_LOCATION_ENABLED: "false"
ANDROID_LOCATION_LATITUDE: ""
ANDROID_LOCATION_LONGITUDE: ""

# === Geo delimitação (massa de teste) ===
# Um ponto dentro e um fora da área cadastrada para o usuário de teste.
# Vazias: os testes de geo são pulados. Preencha as quatro ou nenhuma.
ANDROID_GEO_DENTRO_LATITUDE: ""
ANDROID_GEO_DENTRO_LONGITUDE: ""
ANDROID_GEO_FORA_LATITUDE: ""
ANDROID_GEO_FORA_LONGITUDE: ""

# === API de controle do celular ===
API_BASE_URL: "https://sua-api-aqui"
API_USER: "SEU_USUARIO_API"
API_TOKEN: "SEU_TOKEN_API"
MONITOR_NOME_PESSOA: "NOME_USUARIO_AQUI"

# === Jornada do usuário de teste (opcional) ===
# Horários da escala, como a tela Ponto mostra num dia ESCALADO futuro.
# Vazia: o teste não compara a escala.
APP_JORNADA: ""
